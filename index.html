<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>常用剪貼簿與片段回顧小工具</title>
<style>
:root{--bg:#f4f8fc;--card:#fff;--ink:#17324d;--body:#40566b;--mute:#71869a;--line:#d9e5ef;--red:#1769aa;--pass:#147a5b;--navy:#1769aa}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121317;--card:#1b1d23;--ink:#eef0f4;--body:#c4c7cf;--mute:#8a8f9a;--line:#2c2f37}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
main{max-width:900px;margin:auto;padding:22px 16px 48px}
.eyebrow{color:var(--red);font-weight:800;letter-spacing:.12em;font-size:13px}
h1{margin:.15em 0 .2em;font-size:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,.btn{font:inherit;font-weight:800;border:0;border-radius:999px;padding:8px 16px;cursor:pointer;background:var(--navy);color:#fff}
button.ghost,.btn.ghost{background:transparent;color:var(--navy);border:2px solid var(--navy)}
input[type=text],textarea,select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg);color:var(--ink);width:100%}
textarea{resize:vertical;min-height:80px}
.term-help{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;background:#eaf3fb;color:#1769aa;font-size:12px;font-weight:700;vertical-align:middle}
.grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
.snippet-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;position:relative}
.snippet-card header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13px;color:var(--mute)}
.snippet-content{white-space:pre-wrap;word-break:break-all;background:var(--bg);padding:10px;border-radius:8px;font-family:monospace;font-size:14px;margin-bottom:8px}
.tag{font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--ink)}
footer{margin-top:18px;font-size:13px;color:var(--mute);text-align:center}
</style>
</head>
<body>
<main>
  <div class="eyebrow">辦公效率 · 剪貼簿回顧工具</div>
  <h1>常用文字片段與剪貼簿回收箱 <span class="term-help">快速儲存與一鍵複製常用文字</span></h1>
  <p style="color:var(--body);margin:0 0 16px">把經常需要複製貼上的範本、專案代碼、回覆訊息或近期複製內容記在這裡，點一下即可複製使用。資料僅存放在您的瀏覽器中。</p>

  <div class="card">
    <h2>新增常用片段 <span class="term-help">將常用文字加入清單以供隨時取用</span></h2>
    <div style="margin-bottom:10px">
      <label>標題 / 類別 <input type="text" id="snipTitle" placeholder="例如：專案回報範本、客戶招呼語"></label>
    </div>
    <div style="margin-bottom:10px">
      <label>內容文字 <textarea id="snipText" placeholder="在此貼上或輸入要重複使用的文字內容..."></textarea></label>
    </div>
    <div class="row">
      <button type="button" id="addBtn">新增到片段庫</button>
      <button type="button" class="btn ghost" id="pasteClipboardBtn">從系統剪貼簿讀取貼上 <span class="term-help">直接讀取你剛剛複製的文字</span></button>
      <input type="text" id="searchBox" placeholder="搜尋關鍵字..." style="max-width:240px;margin-left:auto">
    </div>
  </div>

  <div class="card">
    <h2>我的片段清單 <span class="term-help">已儲存的文字片段，點擊複製</span></h2>
    <div class="grid" id="snippetGrid"></div>
  </div>

  <footer>
    剪貼簿小工具 · 資料安全保存在本機瀏覽器
  </footer>
</main>

<script>
const $ = s => document.querySelector(s);
let snippets = JSON.parse(localStorage.getItem('my_snippets_v1') || JSON.stringify([
  { title: '專案回報範本', text: '【進度回報】\n專案代碼：PRJ-2026-01\n本週進度：正常進行中\n待協調事項：無', time: new Date().toLocaleString() },
  { title: '標準招呼語', text: '您好，感謝您的來信與支持，我們已收到您的需求，將盡快安排處理。', time: new Date().toLocaleString() }
]));

function save() {
  localStorage.setItem('my_snippets_v1', JSON.stringify(snippets));
  render();
}

function render() {
  const q = $('#searchBox').value.toLowerCase();
  const grid = $('#snippetGrid');
  const filtered = snippets.filter(s => s.title.toLowerCase().includes(q) || s.text.toLowerCase().includes(q));
  
  if (!filtered.length) {
    grid.innerHTML = '<div style="color:var(--mute);text-align:center;padding:20px;">沒有找到符合的片段</div>';
    return;
  }

  grid.innerHTML = filtered.map((s, idx) => {
    const realIdx = snippets.indexOf(s);
    return `
      <div class="snippet-card">
        <header>
          <span><b>${escapeHtml(s.title)}</b> · <small>${s.time || ''}</small></span>
          <div>
            <button type="button" class="btn" style="padding:4px 12px;font-size:12px;" onclick="copySnippet(${realIdx})">複製</button>
            <button type="button" class="btn ghost" style="padding:4px 8px;font-size:12px;color:var(--stop);border-color:var(--stop);" onclick="deleteSnippet(${realIdx})">刪除</button>
          </div>
        </header>
        <div class="snippet-content">${escapeHtml(s.text)}</div>
      </div>
    `;
  }).join('');
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

window.copySnippet = idx => {
  const text = snippets[idx].text;
  navigator.clipboard.writeText(text).then(() => {
    alert('已複製到剪貼簿！');
  }).catch(err => {
    prompt('複製失敗，請手動複製：', text);
  });
};

window.deleteSnippet = idx => {
  if (confirm('確定要刪除這個片段嗎？')) {
    snippets.splice(idx, 1);
    save();
  }
};

$('#addBtn').onclick = () => {
  const title = $('#snipTitle').value.trim();
  const text = $('#snipText').value.trim();
  if (!text) {
    alert('請輸入內容文字');
    return;
  }
  snippets.unshift({
    title: title || '未命名片段',
    text: text,
    time: new Date().toLocaleString()
  });
  $('#snipTitle').value = '';
  $('#snipText').value = '';
  save();
};

$('#pasteClipboardBtn').onclick = async () => {
  try {
    const text = await navigator.clipboard.readText();
    if (!text) {
      alert('剪貼簿是空的');
      return;
    }
    $('#snipText').value = text;
    $('#snipTitle').value = '從剪貼簿匯入 ' + new Date().toLocaleTimeString();
  } catch (e) {
    alert('無法直接讀取系統剪貼簿（瀏覽器安全限制），請在文字框中按 Ctrl+V 貼上。');
  }
};

$('#searchBox').oninput = render;

render();
</script>
</body>
</html>
